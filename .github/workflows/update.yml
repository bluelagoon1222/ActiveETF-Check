name: Update Active ETF data

on:
  schedule:
    - cron: '40 9 * * 1-5'
    - cron: '10 12 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Trading date YYYYMMDD (leave empty = latest)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Collect data from KRX
        env:
          TRADE_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$TRADE_DATE" ]; then
            python scripts/collect.py --date "$TRADE_DATE"
          else
            python scripts/collect.py
          fi

      - name: Commit and push data
        if: always()
        run: |
          git config user.name  "activeetf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
